<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卦象解读 · 国风文档渲染预览</title>
<style>
  body{margin:0;padding:24px 14px 60px;background:#efe7d6;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:720px;margin:0 auto}
  .pv-tip{font-size:12px;color:#8a7a5e;margin:0 0 14px;text-align:center}
  /* ===== 以下 CSS 与 index.html 内 .ai-out 国风文档块保持一致 ===== */
  .ai-out{position:relative;background:
      radial-gradient(circle at 12% 6%, #FFFDF6 0%, transparent 40%),
      radial-gradient(circle at 90% 94%, #F6EEDC 0%, transparent 42%),
      linear-gradient(160deg,#FBF6EC,#F4EAD6);
    border:1px solid #C9A86A;border-radius:14px;padding:16px 16px 14px;margin-top:4px;
    box-shadow:0 3px 14px rgba(90,70,50,.10);
    font-family:"KaiTi","STKaiti","Noto Serif SC",serif;color:#3A332B;line-height:1.8;font-size:14.5px}
  .ai-out:before,.ai-out:after{content:'';position:absolute;width:14px;height:14px;border:2px solid #A32D2D;opacity:.6}
  .ai-out:before{top:7px;left:7px;border-right:none;border-bottom:none;border-radius:3px 0 0 0}
  .ai-out:after{bottom:7px;right:7px;border-left:none;border-top:none;border-radius:0 0 3px 0}
  .jy-verdict{background:linear-gradient(135deg,#FFFDF8,#F7EEDC);border:1px solid #E2C893;border-left:4px solid #A32D2D;
    border-radius:10px;padding:12px 14px;margin:2px 0 14px;font-size:15.5px;font-weight:700;color:#5a4632;
    box-shadow:0 2px 8px rgba(150,120,70,.08);line-height:1.7}
  .jy-verdict .jy-tag{display:inline-block;font-size:11px;color:#fff;background:#A32D2D;padding:2px 10px;border-radius:20px;
    letter-spacing:2px;margin-bottom:8px;font-weight:400;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .jy-h2{font-size:16.5px;font-weight:700;margin:18px 0 9px;padding-left:11px;border-left:4px solid #C9A86A;color:#5a4632;letter-spacing:1px;line-height:1.4}
  .ai-out p{margin:9px 0;line-height:1.85}
  .ai-out b{color:#A32D2D;font-weight:700}
  .jy-ok{color:#5f7a4e;font-weight:700}
  .jy-no{color:#A32D2D;font-weight:700}
  .jy-ul{list-style:none;margin:9px 0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .jy-ul li{background:#FFFDF9;border:1px solid #E8DCC2;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;box-shadow:0 1px 3px rgba(90,70,50,.05)}
  .jy-ul li b{display:block;margin-bottom:3px;font-size:13.5px;color:#A32D2D}
  @media(max-width:420px){.jy-ul{grid-template-columns:1fr}}
  .jy-todo{list-style:none;margin:9px 0;padding:0;counter-reset:jy}
  .jy-todo li{counter-increment:jy;background:#FFFDF9;border:1px solid #E2D4BA;border-radius:12px;
    padding:11px 14px 11px 46px;margin-bottom:9px;position:relative;font-size:14px;line-height:1.7;box-shadow:0 1px 3px rgba(90,70,50,.05)}
  .jy-todo li:before{content:counter(jy);position:absolute;left:13px;top:11px;width:22px;height:22px;
    background:linear-gradient(135deg,#C9A86A,#A8873F);color:#fff;border-radius:50%;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .jy-note{margin-top:16px;padding:11px 14px;background:rgba(201,168,106,.12);border:1px solid #E2D4BA;border-radius:10px;
    font-size:12.5px;color:#7a6a52;line-height:1.8;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  .jy-divider{height:1px;background:linear-gradient(90deg,transparent,#C9A86A,transparent);margin:18px 0 6px}
</style>
</head>
<body>
<div class="wrap">
  <p class="pv-tip">预览：index.html 大模型输出（.ai-out）国风文档渲染效果 · 与线上一致</p>
  <div class="ai-out" id="box"></div>
</div>
<script>
function renderJyDoc(src) {
  if (!src) return '';
  var lines = String(src).replace(/\r\n/g, '\n').split('\n');
  var out = [], buf = [], firstDone = false;
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function inline(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>'); }
  function isHead(l){ return /^(#{1,3}\s+|【[一二三四五六七八九十]+[、.]\s*|第[一二三四五六七八九十]+步[：:])/.test(l); }
  function headText(l){ return l.replace(/^#{1,3}\s+/,'').replace(/^【/,'').replace(/】$/,'').trim(); }
  function flush(){
    if (!buf.length) return;
    var t = buf.join('<br>'); buf = [];
    if (!firstDone) { firstDone = true; out.push('<div class="jy-verdict"><span class="jy-tag">卦象结论</span>'+t+'</div>'); }
    else if (/理性提示|AI\s*生成|仅供参考|不构成/.test(t)) { out.push('<div class="jy-note">'+t+'</div>'); }
    else { out.push('<p>'+t+'</p>'); }
  }
  for (var i=0;i<lines.length;i++){
    var l = lines[i];
    if (/^>\s?/.test(l)) { flush(); var q=[]; while (i<lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/,'')); i++; } out.push('<div class="jy-verdict"><span class="jy-tag">一句话结论</span>'+inline(q.join('<br>'))+'</div>'); firstDone=true; continue; }
    if (/^\s*[-*]\s+/.test(l)) { flush(); var ul=[]; while (i<lines.length && /^\s*[-*]\s+/.test(lines[i])) { var it=lines[i].replace(/^\s*[-*]\s+/,''); var mm=it.match(/^([^：:]+)[：:]\s*(.*)$/); ul.push(mm ? '<li><b>'+inline(mm[1])+'</b>'+inline(mm[2])+'</li>' : '<li>'+inline(it)+'</li>'); i++; } out.push('<ul class="jy-ul">'+ul.join('')+'</ul>'); continue; }
    if (/^\s*\d+[.、]\s+/.test(l)) { flush(); var ol=[]; while (i<lines.length && /^\s*\d+[.、]\s+/.test(lines[i])) { ol.push('<li>'+inline(lines[i].replace(/^\s*\d+[.、]\s+/,''))+'</li>'); i++; } out.push('<ol class="jy-todo">'+ol.join('')+'</ol>'); continue; }
    if (/^\s*(---|\*\*\*|___)\s*$/.test(l)) { flush(); out.push('<div class="jy-divider"></div>'); continue; }
    if (isHead(l)) { flush(); out.push('<h3 class="jy-h2">'+inline(headText(l))+'</h3>'); continue; }
    if (l.trim()==='') { flush(); continue; }
    buf.push(inline(l));
  }
  flush();
  return out.join('\n');
}
var SAMPLE = [
  '你问"财运/生意"——财有其象，但得之费力：可以小步试水，不宜重仓投入。',
  '',
  '【一、吉凶判断】',
  '妻财（初爻丑土）强于忌神兄弟，吉象；但用神处"休"地、被金局泄气，属"有气待引"，非大财。',
  '原神子孙（五爻巳火）月囚、长生入绝，财源弱则纵得亦难长久。',
  '',
  '## 核心判断',
  '- 财能不能得：可得，但费力、量有限',
  '- 财源（客户/现金流）：弱，最大隐忧',
  '- 我方（世爻）：极弱但非全无',
  '- 对方（应爻）：强旺的压制方',
  '',
  '应期参考',
  '1. 酉日（起卦当日）：冲空则实，宜即日起做小规模验证。',
  '2. 子日（约第 3 天）：丑与子六合，第一笔实际回款或关键进展。',
  '3. 巳、午日（约第 8–9 天）：火生土，财爻得气之期，可再评估是否加码。',
  '',
  '理性提示：六爻是决策辅助，而非宿命判决。本卦示"财有其象而得之费力"，成事在于是否小步验证、守规避争，而非卦象替你定输赢。'
].join('\n');
document.getElementById('box').innerHTML = renderJyDoc(SAMPLE);
</script>
</body>
</html>
